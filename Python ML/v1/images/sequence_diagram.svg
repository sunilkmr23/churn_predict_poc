<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A3C6E"/>
    </marker>
    <marker id="arrow-d-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/>
    </marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7E5109"/>
    </marker>
    <filter id="shadow-seq" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="650" fill="#FAFBFC" rx="8"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A3C6E">Sequence Diagram — Predict Churn Request Flow</text>

  <!-- Lifelines -->
  <rect x="40" y="50" width="110" height="36" rx="6" fill="#1ABC9C" stroke="#0E6655" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="95" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">Browser</text>
  <line x1="95" y1="86" x2="95" y2="620" stroke="#1ABC9C" stroke-width="1.5" stroke-dasharray="6,3"/>

  <rect x="230" y="50" width="120" height="36" rx="6" fill="#1ABC9C" stroke="#0E6655" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="290" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">Express UI</text>
  <line x1="290" y1="86" x2="290" y2="620" stroke="#1ABC9C" stroke-width="1.5" stroke-dasharray="6,3"/>

  <rect x="430" y="50" width="120" height="36" rx="6" fill="#F39C12" stroke="#7E5109" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="490" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">Spring Boot</text>
  <line x1="490" y1="86" x2="490" y2="620" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="6,3"/>

  <rect x="640" y="50" width="110" height="36" rx="6" fill="#2980B9" stroke="#1A3C6E" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="695" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">FastAPI</text>
  <line x1="695" y1="86" x2="695" y2="620" stroke="#2980B9" stroke-width="1.5" stroke-dasharray="6,3"/>

  <rect x="820" y="50" width="50" height="36" rx="6" fill="#2980B9" stroke="#1A3C6E" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="845" y="73" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF">Model</text>
  <line x1="845" y1="86" x2="845" y2="270" stroke="#2980B9" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- 1. User fills form and clicks Predict -->
  <rect x="30" y="110" width="14" height="20" rx="3" fill="#1A3C6E"/>
  <text x="50" y="125" font-size="10" fill="#1A3C6E" font-weight="bold">1</text>
  <text x="145" y="125" font-size="10" fill="#666" font-style="italic">User fills customer form, clicks "Predict Churn"</text>

  <!-- 2. POST /api/predict -->
  <rect x="30" y="150" width="14" height="20" rx="3" fill="#1A3C6E"/>
  <text x="50" y="165" font-size="10" fill="#1A3C6E" font-weight="bold">2</text>
  <line x1="120" y1="160" x2="270" y2="160" stroke="#1A3C6E" stroke-width="2" marker-end="url(#arrow-s)"/>
  <text x="165" y="153" text-anchor="middle" font-size="9" fill="#1A3C6E">POST /api/predict</text>

  <!-- 3. Forward to Spring Boot -->
  <rect x="30" y="190" width="14" height="20" rx="3" fill="#1A3C6E"/>
  <text x="50" y="205" font-size="10" fill="#1A3C6E" font-weight="bold">3</text>
  <line x1="345" y1="200" x2="470" y2="200" stroke="#1A3C6E" stroke-width="2" marker-end="url(#arrow-s)"/>
  <text x="390" y="193" text-anchor="middle" font-size="9" fill="#1A3C6E">POST /api/churn/predict-by-customer</text>

  <!-- 4. Forward to FastAPI -->
  <rect x="30" y="230" width="14" height="20" rx="3" fill="#1A3C6E"/>
  <text x="50" y="245" font-size="10" fill="#1A3C6E" font-weight="bold">4</text>
  <line x1="530" y1="240" x2="675" y2="240" stroke="#1A3C6E" stroke-width="2" marker-end="url(#arrow-s)"/>
  <text x="590" y="233" text-anchor="middle" font-size="9" fill="#1A3C6E">POST /predict</text>

  <!-- 5. Load model & preprocess -->
  <rect x="30" y="270" width="14" height="20" rx="3" fill="#1A3C6E"/>
  <text x="50" y="285" font-size="10" fill="#1A3C6E" font-weight="bold">5</text>
  <line x1="720" y1="280" x2="825" y2="280" stroke="#1A3C6E" stroke-width="2" marker-end="url(#arrow-s)"/>
  <text x="770" y="273" text-anchor="middle" font-size="9" fill="#1A3C6E">load_model()</text>

  <!-- Self-loop: preprocessing -->
  <path d="M695,300 Q750,300 750,330 Q750,345 695,345" fill="none" stroke="#2980B9" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <text x="760" y="323" text-anchor="start" font-size="9" fill="#2980B9">Preprocess & predict</text>

  <!-- 6. Return prediction -->
  <rect x="30" y="360" width="14" height="20" rx="3" fill="#7E5109"/>
  <text x="50" y="375" font-size="10" fill="#7E5109" font-weight="bold">6</text>
  <line x1="695" y1="370" x2="510" y2="370" stroke="#7E5109" stroke-width="2" marker-end="url(#arrow-ret)"/>
  <text x="610" y="363" text-anchor="middle" font-size="9" fill="#7E5109">Prediction JSON</text>

  <!-- 7. Spring Boot returns -->
  <rect x="30" y="400" width="14" height="20" rx="3" fill="#7E5109"/>
  <text x="50" y="415" font-size="10" fill="#7E5109" font-weight="bold">7</text>
  <line x1="490" y1="410" x2="350" y2="410" stroke="#7E5109" stroke-width="2" marker-end="url(#arrow-ret)"/>
  <text x="425" y="403" text-anchor="middle" font-size="9" fill="#7E5109">Prediction JSON</text>

  <!-- 8. Express returns -->
  <rect x="30" y="440" width="14" height="20" rx="3" fill="#7E5109"/>
  <text x="50" y="455" font-size="10" fill="#7E5109" font-weight="bold">8</text>
  <line x1="290" y1="450" x2="160" y2="450" stroke="#7E5109" stroke-width="2" marker-end="url(#arrow-ret)"/>
  <text x="230" y="443" text-anchor="middle" font-size="9" fill="#7E5109">Prediction JSON</text>

  <!-- 9. Render result -->
  <rect x="30" y="480" width="14" height="20" rx="3" fill="#7E5109"/>
  <text x="50" y="495" font-size="10" fill="#7E5109" font-weight="bold">9</text>
  <text x="145" y="495" font-size="10" fill="#666" font-style="italic">React renders prediction card with risk, probability & campaign info</text>

  <!-- Data Overview Sequence -->
  <text x="450" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A3C6E">Data Overview (Dashboard Load) Flow</text>

  <!-- A. Dashboard load -->
  <rect x="30" y="555" width="14" height="20" rx="3" fill="#1ABC9C"/>
  <text x="50" y="570" font-size="10" fill="#1ABC9C" font-weight="bold">A</text>
  <line x1="120" y1="565" x2="270" y2="565" stroke="#1ABC9C" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <text x="165" y="558" text-anchor="middle" font-size="9" fill="#1ABC9C">GET /api/customers</text>

  <!-- B. Feature importance -->
  <rect x="30" y="585" width="14" height="20" rx="3" fill="#1ABC9C"/>
  <text x="50" y="600" font-size="10" fill="#1ABC9C" font-weight="bold">B</text>
  <line x1="120" y1="595" x2="270" y2="595" stroke="#1ABC9C" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <text x="165" y="588" text-anchor="middle" font-size="9" fill="#1ABC9C">GET /api/feature-importance → FastAPI</text>

  <!-- C. Spring churn feed -->
  <rect x="30" y="615" width="14" height="20" rx="3" fill="#1ABC9C"/>
  <text x="50" y="630" font-size="10" fill="#1ABC9C" font-weight="bold">C</text>
  <line x1="120" y1="625" x2="270" y2="625" stroke="#1ABC9C" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <text x="165" y="618" text-anchor="middle" font-size="9" fill="#1ABC9C">GET /api/churn/getchurndata → Spring Boot</text>
</svg>