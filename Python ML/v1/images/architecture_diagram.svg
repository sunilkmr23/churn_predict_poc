<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A3C6E"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/>
    </marker>
    <linearGradient id="tier1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F4FD"/>
      <stop offset="100%" style="stop-color:#D1E8F5"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF9E7"/>
      <stop offset="100%" style="stop-color:#FDEBD0"/>
    </linearGradient>
    <linearGradient id="tier3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F8F5"/>
      <stop offset="100%" style="stop-color:#D1F2EB"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#FAFBFC" rx="8"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A3C6E">System Architecture — High-Level Component Diagram</text>

  <!-- TIER 3: Presentation Layer -->
  <rect x="30" y="50" width="840" height="120" rx="8" fill="url(#tier3)" stroke="#1ABC9C" stroke-width="2"/>
  <text x="50" y="75" font-size="13" font-weight="bold" fill="#0E6655">TIER 3 — PRESENTATION LAYER</text>

  <rect x="60" y="90" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#1ABC9C" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#0E6655">Browser</text>
  <text x="140" y="135" text-anchor="middle" font-size="10" fill="#555">React SPA (Vite)</text>

  <rect x="320" y="90" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1ABC9C" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#0E6655">Express UI Server</text>
  <text x="410" y="135" text-anchor="middle" font-size="10" fill="#555">Port 4000</text>

  <!-- Arrow Browser → Express -->
  <line x1="220" y1="110" x2="310" y2="110" stroke="#1A3C6E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="103" text-anchor="middle" font-size="9" fill="#1A3C6E">HTTP</text>

  <!-- TIER 2: API & Integration Layer -->
  <rect x="30" y="200" width="840" height="120" rx="8" fill="url(#tier2)" stroke="#F39C12" stroke-width="2"/>
  <text x="50" y="225" font-size="13" font-weight="bold" fill="#7E5109">TIER 2 — API & INTEGRATION LAYER</text>

  <rect x="60" y="240" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#F39C12" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#7E5109">Spring Boot</text>
  <text x="150" y="285" text-anchor="middle" font-size="10" fill="#555">Port 3333</text>

  <!-- Arrow Express → Spring Boot -->
  <line x1="500" y1="110" x2="500" y2="230" stroke="#1A3C6E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="173" text-anchor="start" font-size="9" fill="#1A3C6E">/api/predict</text>
  <text x="515" y="185" text-anchor="start" font-size="9" fill="#1A3C6E">/api/churn/getchurndata</text>

  <!-- Arrow Spring Boot → Express (response) -->
  <line x1="150" y1="240" x2="410" y2="160" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-r)"/>
  <text x="250" y="210" text-anchor="middle" font-size="9" fill="#C0392B">Response</text>

  <!-- TIER 1: Data & Model Layer -->
  <rect x="30" y="350" width="840" height="120" rx="8" fill="url(#tier1)" stroke="#2980B9" stroke-width="2"/>
  <text x="50" y="375" font-size="13" font-weight="bold" fill="#1A3C6E">TIER 1 — DATA & MODEL LAYER</text>

  <rect x="60" y="390" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#2980B9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A3C6E">FastAPI</text>
  <text x="150" y="435" text-anchor="middle" font-size="10" fill="#555">Port 8000</text>

  <rect x="320" y="390" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#2980B9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A3C6E">Model</text>
  <text x="400" y="435" text-anchor="middle" font-size="10" fill="#555">churn_model.pkl</text>

  <rect x="560" y="390" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#2980B9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A3C6E">Dataset</text>
  <text x="650" y="435" text-anchor="middle" font-size="10" fill="#555">fiber_customers_realistic.csv</text>

  <!-- Arrow Spring Boot → FastAPI -->
  <line x1="240" y1="270" x2="240" y2="380" stroke="#1A3C6E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="330" text-anchor="start" font-size="9" fill="#1A3C6E">Forward prediction request</text>

  <!-- Arrow FastAPI → Model -->
  <line x1="240" y1="420" x2="310" y2="420" stroke="#1A3C6E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="412" text-anchor="middle" font-size="9" fill="#1A3C6E">load</text>

  <!-- Arrow FastAPI + Dataset -->
  <line x1="520" y1="420" x2="550" y2="420" stroke="#1A3C6E" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <rect x="700" y="480" width="12" height="12" rx="2" fill="#1A3C6E"/>
  <text x="716" y="491" font-size="9" fill="#555">Request</text>
  <rect x="770" y="480" width="12" height="12" rx="2" fill="#C0392B"/>
  <text x="786" y="491" font-size="9" fill="#555">Response</text>
</svg>